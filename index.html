<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Shop Scheduler</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for a clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- top Nvigation Bar to swich Screens  -->
        <nav class="top-nav">
            <div class="brand">
                <h2>✂️ BIBO`s barber shop</h2>
                <p>Shop Schedule Manager</p>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-screen="screen-1">Screen 1: Bookings & Management</button>
                <button class="nav-tab" data-screen="screen-2">Screen 2: Weekly Calendar Grid</button>
            </div>
        </nav>

        <!-- SCREEN 1: Booking & Management Dashboard -->
        <section id="screen-1" class="screen-view active">
            <div class="screen-1-layout">
                <!-- Sidebar Form -->
                <div class="booking-card">
                    <h3>New Appointment</h3>
                    <form id="booking-form">
                        <div class="form-group">
                            <label for="client-name">Client Name</label>
                            <input type="text" id="client-name" required placeholder="e.g. John Doe">
                        </div>

                        <div class="form-group">
                            <label for="select-barber">Select Barber</label>
                            <select id="select-barber" required>
                                <option value="">Choose a barber...</option>
                                <option value="Marcus">Marcus</option>
                                <option value="Devon">Devon</option>
                                <option value="Leo">Leo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="select-service">Service & Price</label>
                            <select id="select-service" required>
                                <option value="">Choose service...</option>
                                <option value="Skin Fade ($30) [30 mins]">Skin Fade ($30) - 30m</option>
                                <option value="Beard Trim ($15) [15 mins]">Beard Trim ($15) - 15m</option>
                                <option value="Haircut & Beard ($45) [45 mins]">Haircut & Beard ($45) - 45m</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="appointment-date">Date</label>
                            <input type="date" id="appointment-date" required>
                        </div>

                        <div class="form-group">
                            <label for="appointment-time">Time Slot</label>
                            <input type="time" id="appointment-time" min="09:00" max="18:00" required>
                        </div>

                        <button type="submit" class="btn-primary">Book Appointment</button>
                    </form>
                </div>

                <!-- Upcoming Appointments List Panel -->
                <div class="appointments-list-panel">
                    <h3>Active Bookings Overview</h3>
                    <div id="active-bookings-list" class="bookings-list">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- SCREEN 2: Weekly Calendar View (Monday - Sunday) -->
        <section id="screen-2" class="screen-view">
            <header class="calendar-header">
                <div>
                    <h1 id="week-range-display">Weekly Schedule</h1>
                    <p>Monday to Sunday Barber Timetable</p>
                </div>
                <div class="date-controls">
                    <button class="btn-secondary" id="prev-week">← Prev Week</button>
                    <button class="btn-secondary" id="this-week-btn">This Week</button>
                    <button class="btn-secondary" id="next-week">Next Week →</button>
                </div>
            </header>

            <div class="weekly-grid-container">
                <div class="time-column">
                    <div class="time-header">Time</div>
                    <div class="time-slot">09:00 AM</div>
                    <div class="time-slot">10:00 AM</div>
                    <div class="time-slot">11:00 AM</div>
                    <div class="time-slot">12:00 PM</div>
                    <div class="time-slot">01:00 PM</div>
                    <div class="time-slot">02:00 PM</div>
                    <div class="time-slot">03:00 PM</div>
                    <div class="time-slot">04:00 PM</div>
                    <div class="time-slot">05:00 PM</div>
                </div>

                <!-- 7 Columns: Monday through Sunday -->
                <div class="days-container" id="weekly-days-grid">
                    <!-- Injected via JavaScript -->
                </div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
